# Prometheus Configuration
# Save as prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'resonance-school-monitor'

scrape_configs:
  - job_name: 'resonance-data-integration'
    static_configs:
      - targets: ['localhost:3000']
        labels:
          service: 'data-integration'
          environment: 'production'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules can be configured here
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Recording rules
rule_files:
  # - "alerts.yml"
